<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Doubt Solver - Aptitude AI</title>
  <link rel="stylesheet" href="/static/CSS/Dashboard.css" />
  <link rel="stylesheet" href="/static/CSS/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    .doubt-box {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.04);
      padding: 30px;
      margin-bottom: 28px;
    }
    
    .chat-history {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .chat-card {
      background: #f8f7f5;
      border: 1.5px solid #d8cfb5;
      border-radius: 14px;
      padding: 20px;
      transition: all 0.2s;
    }
    
    .chat-card.solution-ready {
      border-left: 5px solid #4d4742;
    }
    
    .doubt-context-label {
      font-size: 11px;
      font-weight: 700;
      color: #6d6a64;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: block;
    }
    
    .solution-markdown {
      font-size: 14px;
      line-height: 1.7;
      color: #3b3128;
      margin-top: 14px;
    }

    /* Enhanced markdown styles */
    .solution-markdown h2, .solution-markdown h3 {
      font-family: 'Rozha One', serif;
      color: #1a1714;
      margin: 8px 0 10px;
    }

    .md-box {
      background: linear-gradient(180deg, rgba(234,214,144,0.12), rgba(243,220,201,0.06));
      border-left: 4px solid #9b63af;
      padding: 12px 14px;
      border-radius: 10px;
      margin: 12px 0;
      color: #2d2b27;
    }

    .md-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: 8px;
      overflow: hidden;
    }
    .md-table th, .md-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      text-align: left;
      font-size: 13px;
    }
    .md-table th {
      background: rgba(155,99,175,0.06);
      font-weight:700;
      color: #3b3128;
    }

    .md-cheatsheet { display:flex; gap:12px; flex-wrap:wrap; }
    .md-chip { background:#f3f0ee; padding:6px 10px; border-radius:999px; font-weight:700; color:#6d6a64; }
    
    .solution-markdown p {
      margin-bottom: 12px;
    }
    
    .solution-markdown code {
      background: #eadba3;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }
    
    .solution-markdown pre {
      background: #282522;
      color: #ffffff;
      padding: 16px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 12px 0;
    }
    
    .solution-markdown pre code {
      background: none;
      color: inherit;
      padding: 0;
      font-size: 13px;
    }
  </style>
</head>
<body data-page="doubt-solver">
  <a class="apti-skip-link" href="#main-content">Skip to main content</a>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <div class="container">
    
    <!-- SIDEBAR -->
    {% include "partials/sidebar.html" %}
    
    <!-- MAIN -->
    <main class="main-content" id="main-content" tabindex="-1">
      
      <!-- HEADER -->
      <div class="dashboard-head">
        <div style="display:flex;align-items:center;gap:14px;">
          <div>
            <p class="eyebrow">AI Tutor</p>
            <h1>Doubt Solver</h1>
          </div>
        </div>
      </div>
      
      <!-- SUBMIT DUBT FORM -->
      <div class="doubt-box">
        <h2 style="font-size:20px;font-weight:700;margin-bottom:12px;">Get Step-by-Step Solutions</h2>
        <p class="muted" style="margin-bottom:20px;">Ask any question about programming logic, aptitude calculations, test topics, or syntax bugs.</p>
        
        <div class="form-group" style="margin-bottom:14px;">
          <label for="doubt-context" style="font-weight:700;font-size:12px;color:#4d4742;text-transform:uppercase;">Topic / Context</label>
          <input type="text" id="doubt-context" style="width:100%;border:1.5px solid #d8cfb5;border-radius:10px;padding:10px;font:inherit;outline:none;" placeholder="e.g. Binary Trees, Time and Work, TCS NQT, Arrays..." />
        </div>
        
        <div class="form-group" style="margin-bottom:14px;">
          <label for="doubt-question" style="font-weight:700;font-size:12px;color:#4d4742;text-transform:uppercase;">Question Description / Code Snippet (Optional)</label>
          <textarea id="doubt-question" rows="4" style="width:100%;border:1.5px solid #d8cfb5;border-radius:10px;padding:10px;font:inherit;outline:none;font-family:monospace;" placeholder="Paste the problem statement or code snippet here..."></textarea>
        </div>
        
        <div class="form-group" style="margin-bottom:20px;">
          <label for="doubt-text" style="font-weight:700;font-size:12px;color:#4d4742;text-transform:uppercase;">What is your specific doubt?</label>
          <textarea id="doubt-text" rows="3" style="width:100%;border:1.5px solid #d8cfb5;border-radius:10px;padding:10px;font:inherit;outline:none;" placeholder="Explain what you are struggling with or need explained..."></textarea>
        </div>
        
        <button id="solve-btn" class="btn-primary" style="width:100%;justify-content:center;padding:14px;">
          <i class="fa-solid fa-lightbulb"></i> Explain Step-by-Step
        </button>
      </div>
      
      <!-- RESOLUTIONS DISPLAY -->
      <div id="solutions-section-container" class="chat-history">
        <!-- Explains will show up here -->
      </div>
      
    </main>
  </div>
  
  <script src="/static/JS/responsive.js"></script>
  <script src="/static/JS/script.js"></script>
  <script>
    (function() {
      const token = localStorage.getItem('access_token');
      if (!token) { window.location.href = '/login'; return; }
      
      // Load user profile details
      try {
        const user = JSON.parse(localStorage.getItem('user'));
        if (user?.username) {
          document.getElementById('sidebar-username').textContent = user.username;
        }
      } catch(e) {}
      
      document.querySelectorAll('[data-page]').forEach(item => {
        if (item === document.body) return;
        item.addEventListener('click', (event) => {
          const target = item.dataset.page;
          if (!target) return;
          event.preventDefault();
          window.location.href = target.startsWith('/') ? target : `/${target}`;
        });
      });
      document.querySelectorAll('[data-action="logout"]').forEach(item => {
        item.addEventListener('click', () => {
          localStorage.clear();
          window.location.href = '/login';
        });
      });
      
      const solveBtn = document.getElementById('solve-btn');
      solveBtn.addEventListener('click', async () => {
        const ctx = document.getElementById('doubt-context').value.trim();
        const q = document.getElementById('doubt-question').value.trim();
        const doubt = document.getElementById('doubt-text').value.trim();
        
        if (!doubt) {
          alert("Please type your doubt so the AI tutor can assist you.");
          return;
        }
        
        solveBtn.disabled = true;
        solveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Formulating Explanation...';
        
        try {
          const res = await fetch('/api/v1/doubt/solve', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              context: ctx || "General Query",
              question: q,
              doubt: doubt
            })
          });
          const data = await res.json();
          if (data.success) {
            const payload = data.data || data;
            
            // Render solution
            const container = document.getElementById('solutions-section-container');
            const card = document.createElement('div');
            card.className = "chat-card solution-ready";
            
            // Basic markdown replacement for UI rendering
            const rawMarkdown = payload.solution;
            const formattedHtml = parseSimpleMarkdown(rawMarkdown);
            
            card.innerHTML = `
              <span class="doubt-context-label">${ctx || 'General Query'}</span>
              <h3 style="font-size:15px;font-weight:700;color:#1a1714;">Doubt: "${doubt}"</h3>
              ${q ? `<p style="font-size:13px;color:#6d6a64;background:#fff;padding:8px 12px;border:1px solid #d8cfb5;border-radius:6px;margin:8px 0;white-space:pre-wrap;font-family:monospace;">${escapeHtml(q)}</p>` : ''}
              <hr style="border:none;border-top:1px solid rgba(0,0,0,0.06);margin:12px 0;" />
              <div class="solution-markdown">
                ${formattedHtml}
              </div>
            `;

            // Render math inside the inserted solution (KaTeX auto-render)
            try {
              if (window.renderMathInElement) {
                // small delay to ensure DOM added
                setTimeout(() => {
                  renderMathInElement(card, {
                    delimiters: [
                      {left: '$$', right: '$$', display: true},
                      {left: '\\[', right: '\\]', display: true},
                      {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                  });
                }, 20);
              }
            } catch (e) { console.warn('KaTeX render failed', e); }
            
            // Insert at the top of history
            container.insertBefore(card, container.firstChild);
            
            // Reset input doubt field
            document.getElementById('doubt-text').value = "";
          } else {
            alert(data.error || "Failed to solve doubt.");
          }
        } catch(e) {
          alert("Network error.");
        } finally {
          solveBtn.disabled = false;
          solveBtn.innerHTML = '<i class="fa-solid fa-lightbulb"></i> Explain Step-by-Step';
        }
      });
      
      function parseSimpleMarkdown(md) {
        if (!md) return '';
        // Normalize common escape sequences from AI output so KaTeX can find delimiters
        md = String(md).replace(/&#92;/g, '\\'); // HTML-encoded backslash
        // Collapse double-escaped backslashes (\\ -> \\)
        md = md.replace(/\\\\/g, '\\');
        // Unescape escaped dollar signs
        md = md.replace(/\\\$/g, '$');

        let html = md;

        // Code blocks: ```language ... ```
        html = html.replace(/```(?:[a-zA-Z0-9]+)?\n([\s\S]*?)\n```/g, '<pre><code>$1</code></pre>');

        // Tables: simple pipe-separated tables
        // Convert lines that look like a table into a table HTML
        html = html.replace(/(^\|.*\|\n\|[- :|]+\|\n(?:\|.*\|\n?)+)/gm, function(tableBlock) {
          const lines = tableBlock.trim().split('\n');
          const header = lines[0].trim();
          const cols = header.split('|').filter(Boolean).map(c => c.trim());
          const rows = lines.slice(2).map(r => r.split('|').filter(Boolean).map(c=>c.trim()));
          let t = '<table class="md-table"><thead><tr>' + cols.map(c=>`<th>${c}</th>`).join('') + '</tr></thead><tbody>';
          rows.forEach(r => { t += '<tr>' + r.map(c=>`<td>${c}</td>`).join('') + '</tr>'; });
          t += '</tbody></table>';
          return t;
        });

        // Inline code: `code`
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Bold: **text**
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

        // Headings: ## or ###
        html = html.replace(/^###\s*(.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^##\s*(.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^#\s*(.+)$/gm, '<h2>$1</h2>');

        // Boxed callout: lines starting with '::box' until blank line
        html = html.replace(/::box\n([\s\S]*?)\n\n/gm, function(_, content) {
          return `<div class="md-box">${content.trim().replace(/\n/g,'<br>')}</div>`;
        });

        // Horizontal rules (---)
        html = html.replace(/^---$/gm, '<hr />');

        // Paragraphs: split on double newlines
        html = html.split('\n\n').map(p => {
          p = p.trim();
          if (!p) return '';
          if (p.startsWith('<pre>') || p.startsWith('<table') || p.startsWith('<h') || p.startsWith('<hr') || p.startsWith('<div')) return p;
          return `<p>${p.replace(/\n/g, '<br>')}</p>`;
        }).join('');

        return html;
      }
      
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
      // Render any pre-existing math in the solutions container (if KaTeX loaded)
      try {
        setTimeout(() => {
          const container = document.getElementById('solutions-section-container');
          if (container && window.renderMathInElement) {
            renderMathInElement(container, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '\\[', right: '\\]', display: true},
                {left: '\\(', right: '\\)', display: false}
              ],
              throwOnError: false
            });
          }
        }, 80);
      } catch (e) {}
    })();
  </script>
</body>
</html>
